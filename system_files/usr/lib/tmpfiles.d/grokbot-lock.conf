# Markers written by /usr/lib/grokbot/lock-setpin.sh (no secrets inside).
d /var/lib/grokbot 0755 root root -
d /var/lib/grokbot/lock-pin 0755 root root -
# pam_faillock tally for swaylock (etc/pam.d/swaylock). swaylock runs as
# the kiosk user, so that user must be able to write it.
d /var/lib/grokbot/faillock 0700 grokbot grokbot -
