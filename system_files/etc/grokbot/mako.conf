# Grok Bot OS notifications (mako). Users override with ~/.config/mako/config.
# grokbot-notify-dnd switches the do-not-disturb mode.
font=Noto Sans CJK KR 11
background-color=#18181bf0
text-color=#f4f4f5
border-color=#3f3f46
border-size=1
border-radius=10
padding=10,14
margin=10
width=360
anchor=top-right
default-timeout=6000
max-history=50
max-visible=5
group-by=app-name
layer=overlay
on-button-left=dismiss

[urgency=critical]
border-color=#ef4444
# Critical ones stay 60 s (not forever); a click dismisses any notification.
default-timeout=60000

[mode=do-not-disturb]
invisible=1
