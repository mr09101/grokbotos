name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Scripts, Justfile, workflow YAML
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install shellcheck, PyYAML, and rpm tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml rpm cpio

      - name: Check Just syntax
        run: just check

      - name: List recipes
        run: just --list

      - name: Dry-run the image build recipe
        run: just --dry-run build

      - name: Shell tests
        run: tests/run-tests.sh
